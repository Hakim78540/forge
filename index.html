<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24263f">
<meta name="description" content="Full body 3×/semaine, poids du corps, pas, repas et surcharge progressive.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Forge Full Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width app column, dark night-blue top fading into a lavender glass sheet, floating round-icon nav — after the reference mock. Single committed look. */
:root{
  color-scheme:dark;
  --backdrop:#4b4754;
  --backdrop-2:#5d5966;
  --night:#24263f;
  --night-2:#30345a;
  --night-3:#3c4170;
  --ink:#eef0ff;
  --ink-dim:#a6aad0;
  --ink-faint:#6f739c;
  --lav:#efedf8;
  --lav-2:#d5d8f5;
  --lav-3:#c3c8f0;
  --sheet-ink:#2d3057;
  --sheet-dim:#7a7ea8;
  --sheet-line:rgba(45,48,87,.12);
  --peri:#7383f5;
  --peri-deep:#4f5fd6;
  --glow:#9cc6ff;
  --mint:#5fd8b6;
  --mint-ink:#1f7e66;
  --warm:#ffd16b;
  --warn:#e8913a;
  --line:rgba(255,255,255,.09);
  --f-display:"Sora",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:34px; --r-lg:24px; --r-md:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--backdrop-2),var(--backdrop));
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-inline:0;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:10px}
.app{
  max-width:440px;margin:0 auto;min-height:100%;position:relative;
  background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 38%,var(--night-3) 52%,#8f93c9 70%,var(--lav-3) 100%);
  overflow-x:hidden;padding-bottom:110px;
}
@media (min-width:520px){
  body{padding-block:28px}
  .app{border-radius:var(--r-xl);min-height:calc(100% - 56px);box-shadow:0 40px 80px rgba(20,18,40,.45),0 0 0 1px rgba(255,255,255,.06)}
}
.stars{position:absolute;inset:0 0 auto 0;height:420px;pointer-events:none;
  background-image:radial-gradient(1.4px 1.4px at 18% 22%,#fff9 50%,transparent 51%),radial-gradient(1.2px 1.2px at 72% 14%,#fff8 50%,transparent 51%),radial-gradient(1.6px 1.6px at 86% 36%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 40% 8%,#fff7 50%,transparent 51%),radial-gradient(1.3px 1.3px at 60% 30%,#fff6 50%,transparent 51%)}
.pad{padding-inline:20px}
/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px;position:relative;z-index:2}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--ink-dim)}
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(156,198,255,.35),rgba(60,65,112,.6));box-shadow:0 0 22px rgba(156,198,255,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.orb .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--lav);color:var(--sheet-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim)}
.iconbtn:hover{color:var(--ink)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* hero */
.hero{position:relative;padding:4px 20px 0;z-index:1}
.hero-head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big sup{font-size:.42em;font-weight:600;vertical-align:top;position:relative;top:.25em;margin-left:2px;color:var(--ink-dim)}
.hero-sub{color:var(--ink-dim);font-size:13px;margin-top:6px}
.hero-title{text-align:right}
.hero-title b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--ink)}
.hero-title span{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.12em}
.iso{display:block;width:100%;max-width:380px;margin:-10px auto -30px;height:auto}
/* week circles */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:4px 14px 18px;position:relative;z-index:2}
.wk-nav{display:flex;justify-content:space-between;align-items:center;padding:0 20px 8px;font-size:12px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase;position:relative;z-index:2}
.wk-nav button{color:var(--ink-dim);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.dayb{padding:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-dim)}
.dayb .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);
  background:rgba(70,76,128,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 14px rgba(10,10,30,.25);position:relative}
.dayb .c svg.i{width:18px;height:18px}
.dayb.today .c{box-shadow:inset 0 0 0 1.5px rgba(156,198,255,.6),0 6px 14px rgba(10,10,30,.25)}
.dayb.sel .c{background:radial-gradient(circle at 50% 35%,#6f7fd8,#333a73);color:#fff;box-shadow:0 0 18px rgba(156,198,255,.55),inset 0 0 0 1px rgba(255,255,255,.25)}
.dayb.sel{color:var(--ink)}
.dayb .dot{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 2px var(--night-2)}
/* sheet */
.sheet{position:relative;z-index:2;margin:0 10px;border-radius:30px;padding:10px 14px 18px;
  background:linear-gradient(165deg,rgba(247,245,252,.97),rgba(221,223,247,.95) 60%,rgba(200,206,244,.95));
  color:var(--sheet-ink);box-shadow:0 -10px 40px rgba(20,22,50,.25),inset 0 1px 0 #fff}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:rgba(45,48,87,.18);margin:0 auto 10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px}
.row+.row{border-top:1px solid var(--sheet-line)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 35%,#5a67b8,#363c78);box-shadow:0 4px 10px rgba(54,60,120,.35)}
.ic svg.i{width:19px;height:19px}
.ic.soft{background:rgba(115,131,245,.16);color:var(--peri-deep);box-shadow:none}
.ic.mint{background:radial-gradient(circle at 50% 35%,#7fe6c8,#2f9c80)}
.grow{flex:1;min-width:0}
.t1{font-weight:700;font-size:15px;line-height:1.25}
.t2{font-size:12.5px;color:var(--sheet-dim)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.75);color:var(--sheet-ink);box-shadow:inset 0 0 0 1px var(--sheet-line)}
.pill:hover{background:#fff}
.pill.dark{background:var(--sheet-ink);color:#fff;box-shadow:none}
.pill.dark:hover{background:#3b3f73}
.pill svg.i{width:15px;height:15px}
.bar{height:6px;border-radius:3px;background:rgba(45,48,87,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--peri),var(--glow))}
.bar.ok>i{background:linear-gradient(90deg,#3dbb98,var(--mint))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:10px;background:rgba(115,131,245,.14);color:var(--peri-deep)}
.chip.up{background:rgba(95,216,182,.22);color:var(--mint-ink)}
.chip.warn{background:rgba(232,145,58,.18);color:#9a5615}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 4px 8px}
.sec-h h3{margin:0;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sheet-dim)}
.sec-h small{font-size:12px;color:var(--sheet-dim);font-variant-numeric:tabular-nums}
/* exercise card */
.ex{background:rgba(255,255,255,.62);border-radius:20px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 6px 18px rgba(60,64,130,.08)}
.ex+.ex{margin-top:8px}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.ex-tag{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--sheet-ink);color:#fff}
.ex-name{font-weight:800;font-size:15px;line-height:1.25}
.ex-cue{font-size:12px;color:var(--sheet-dim);margin-top:2px}
.ex .chips{margin:8px 0 6px}
.sets{display:grid;gap:6px;margin-top:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center}
.set .n{font-size:12px;font-weight:800;color:var(--sheet-dim);text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;height:38px;border-radius:12px;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px var(--sheet-line);min-width:0}
.stepper button{width:30px;height:100%;flex:none;display:grid;place-items:center;color:var(--sheet-dim);font-size:18px;font-weight:700}
.stepper button:hover{color:var(--sheet-ink)}
.stepper input{width:100%;min-width:0;border:0;background:none;text-align:center;font-weight:800;font-size:15px;color:var(--sheet-ink);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .u{font-size:10.5px;color:var(--sheet-dim);font-weight:700;padding-right:2px;flex:none}
.chk{width:40px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(45,48,87,.08);color:var(--sheet-dim)}
.chk.on{background:linear-gradient(160deg,#7fe6c8,#2f9c80);color:#fff;box-shadow:0 4px 12px rgba(47,156,128,.35)}
.chk svg.i{width:18px;height:18px}
.set.done .stepper{background:rgba(95,216,182,.14)}
.set.bw,.set-head.bw{grid-template-columns:34px 1fr 40px}
.set-head{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--sheet-dim);text-transform:uppercase;text-align:center}
.ex-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ghost{white-space:nowrap;flex:none;height:30px;padding:0 10px;border-radius:15px;font-size:12px;font-weight:700;color:var(--sheet-dim);display:inline-flex;align-items:center;gap:5px}
.ghost:hover{color:var(--sheet-ink);background:rgba(255,255,255,.6)}
.ghost svg.i{width:14px;height:14px}
.block-h{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;font-size:12px;color:var(--sheet-dim);font-weight:700}
.block-h b{font-family:var(--f-display);color:var(--sheet-ink);font-size:13px;letter-spacing:.04em}
.block-h .sep{flex:1;height:1px;background:var(--sheet-line)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;margin-top:16px;
  background:linear-gradient(180deg,#3b3f73,var(--sheet-ink));color:#fff;font-weight:800;font-size:15px;box-shadow:0 10px 24px rgba(45,48,87,.3)}
.cta:hover{filter:brightness(1.1)}
.cta.done{background:linear-gradient(160deg,#5fd8b6,#2f9c80)}
.note{font-size:12.5px;color:var(--sheet-dim);line-height:1.5}
.card{background:rgba(255,255,255,.62);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.card+.card{margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.62);border-radius:18px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--sheet-dim);margin-top:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--sheet-dim)}
.field input,.field select{height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px var(--sheet-line);padding:0 12px;font-weight:700;color:var(--sheet-ink);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(45,48,87,.08);overflow-x:auto}
.seg button{flex:1 0 auto;height:34px;padding:0 12px;border-radius:12px;font-size:12.5px;font-weight:800;color:var(--sheet-dim);white-space:nowrap}
.seg button.on{background:#fff;color:var(--sheet-ink);box-shadow:0 2px 8px rgba(45,48,87,.12)}
.mob{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left}
.mob+.mob{border-top:1px solid var(--sheet-line)}
.mob .chk{flex:none}
/* steps ring */
.ring-wrap{display:grid;place-items:center;position:relative;margin:6px auto 0;width:230px;max-width:100%}
.ring-wrap svg{width:100%;height:auto;display:block}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c .big{font-size:42px}
.ring-c span{color:var(--ink-dim);font-size:12.5px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px 20px 20px;position:relative;z-index:2}
.qbtn{height:40px;padding:0 16px;border-radius:20px;font-weight:800;font-size:13px;color:var(--ink);background:rgba(70,76,128,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.qbtn:hover{background:rgba(95,104,170,.75)}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--sheet-ink);color:#fff;font-size:12px;font-weight:700;padding:6px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-115%);font-variant-numeric:tabular-nums}
.empty{padding:26px 10px;text-align:center;color:var(--sheet-dim);font-size:13px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;font-size:13px}
.hist+.hist{border-top:1px solid var(--sheet-line)}
.hist b{font-weight:800}
.hist span{color:var(--sheet-dim);font-variant-numeric:tabular-nums;text-align:right}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;gap:4px;padding:6px;border-radius:30px;background:rgba(36,38,63,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 14px 30px rgba(20,20,45,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.nav button{display:flex;align-items:center;gap:6px;height:46px;padding:0 12px;border-radius:23px;color:var(--ink-dim);font-weight:800;font-size:13px}
.nav button span{display:none}
.nav button.on{background:radial-gradient(circle at 50% 30%,#6f7fd8,#3a4182);color:#fff;box-shadow:0 0 16px rgba(156,198,255,.4)}
.nav button.on span{display:inline}
/* rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:21;
  display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:26px;background:var(--lav);color:var(--sheet-ink);box-shadow:0 12px 30px rgba(20,20,45,.4)}
.timer small{white-space:nowrap}.timer .pill{white-space:nowrap}
.timer b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;min-width:56px}
.timer small{font-size:11.5px;color:var(--sheet-dim);font-weight:700}
.timer.over{background:linear-gradient(160deg,#7fe6c8,#4cc39f)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:16px;background:var(--lav);color:var(--sheet-ink);font-weight:700;font-size:13.5px;box-shadow:0 12px 30px rgba(20,20,45,.4)}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,20,40,.55);padding:20px}
.modal .card{max-width:360px;width:100%;color:var(--sheet-ink);background:var(--lav)}
.modal h4{margin:0 0 6px;font-family:var(--f-display);font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sync{font-size:11.5px;color:var(--sheet-dim);text-align:center;margin-top:14px}
textarea.dump{width:100%;height:120px;border-radius:12px;border:0;padding:10px;font-size:11px;font-family:ui-monospace,monospace;background:#fff;color:var(--sheet-ink)}
@media (prefers-reduced-motion:no-preference){
  .iso .float{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px)}}
}
@media (max-width:370px){.big{font-size:46px}.set{grid-template-columns:18px 1fr 1fr 36px;gap:6px}.set-head{grid-template-columns:18px 1fr 1fr 36px;gap:6px}.stepper button{width:24px}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#24263f}
@media (max-width:519px){body{background:#24263f}}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
</style>
</head>
<body>


<div class="app" id="app"><div class="stars"></div><div id="view"></div></div>
<nav class="nav" id="nav" aria-label="Navigation">
  <button data-tab="seance" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Séance</span></button>
  <button data-tab="repas"><svg class="i" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 10v11M17 21V3c-2 1-3 4-3 8h3"/></svg><span>Repas</span></button>
  <button data-tab="pas"><svg class="i" viewBox="0 0 24 24"><path d="M8 3c2 0 3 2 3 4.5S10 13 8 13 5 10 5 7.5 6 3 8 3zM6 16h4v2a2 2 0 0 1-4 0zM16 7c2 0 3 2 3 4.5S18 17 16 17s-3-3-3-5.5S14 7 16 7z"/></svg><span>Pas</span></button>
  <button data-tab="progres"><svg class="i" viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg><span>Progrès</span></button>
  <button data-tab="plan"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Plan</span></button>
</nav>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>

<script>
/* ============ icons ============ */
const I = {
  dumb:'<svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  run:'<svg class="i" viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v4M7 11l3-3 4 1 2 3 3 1M11 15l-1-4"/></svg>',

async function connectDb(){

    if(!window.claude||!window.claude.use) return;

/* ============ rng ============ */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ workout logic ============ */
const okEq=e=>S.settings.eq==='g' ? true : (e.eq==='d'||e.eq==='b');
const poolFor=slot=>EX.filter(e=>e.p.includes(slot)&&okEq(e));
function history(id,beforeKey){
  return Object.keys(S.days).filter(k=>k<beforeKey&&S.days[k].wk).sort().reverse()
    .map(k=>{const x=S.days[k].wk.ex.find(e=>e.id===id);if(!x)return null;const done=x.sets.filter(s=>s.done&&s.reps>0);return done.length?{k,done}:null}).filter(Boolean);
}
function suggest(id,key){
  const e=EXI[id]; const [lo,hi]=e.r;
  const h=history(id,key)[0];
  if(!h) return {kg:0,reps:lo,msg:'Première fois : prends une charge où il te reste 2 reps en réserve',last:null,kind:'new'};
  const done=h.done; const top=Math.max(...done.map(s=>+s.kg||0));
  const last=`${done.length}×${done.map(s=>s.reps).join('/')} @ ${fmtKg(top)} kg · ${fmtShort(h.k)}`;
  const topSets=done.filter(s=>(+s.kg||0)===top);
  if(done.length>=2 && done.every(s=>s.reps>=hi)){
    return {kg:+(top+e.inc).toFixed(2),reps:lo,msg:`Haut de fourchette atteint → +${fmtKg(e.inc)} kg`,last,kind:'up'};
  }
  const minR=Math.min(...topSets.map(s=>s.reps));
  if(minR<lo) return {kg:top,reps:lo,msg:`Consolide ${fmtKg(top)} kg, vise ${lo} reps partout`,last,kind:'hold'};
  const t=Math.min(hi,minR+1);
  return {kg:top,reps:t,msg:`Même charge, vise ${t} reps (+1)`,last,kind:'rep'};
}
function makeEx(id,b,key,n){const s=suggest(id,key);return {id,b,sets:Array.from({length:n},()=>({kg:s.kg,reps:s.reps,done:false}))}}
function generate(key,regen){
  const tpl=TPL[DAYPLAN[dateOf(key).getDay()]]; const used=new Set(); const ex=[];
  tpl.blocks.forEach((bl,bi)=>bl.slots.forEach(slot=>{
    const pool=poolFor(slot).filter(e=>!used.has(e.id));
    const r=rng(hash(key+'|'+regen+'|'+slot)); const pick=pool[Math.floor(r()*pool.length)];
    used.add(pick.id); ex.push(makeEx(pick.id,bi,key,bl.sets));
  }));
  return {tpl:DAYPLAN[dateOf(key).getDay()],ex,fin:false};
}
function getWk(key){const d=S.days[key];if(d&&d.wk)return d.wk;return generate(key,(d&&d.regen)||0)}
function lockWk(key){const d=S.days[key]||(S.days[key]={});if(!d.wk)d.wk=generate(key,d.regen||0);return d.wk}
function estMin(wk){
  const tpl=TPL[wk.tpl]; let s=6*60;
  tpl.blocks.forEach((bl,bi)=>{const exs=wk.ex.filter(e=>e.b===bi);exs.forEach(e=>{s+=e.sets.length*(40+bl.rest)});s+=60});

}

const volOf=wk=>wk.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.kg||0)*(+s.reps||0),0),0);
const setsDone=wk=>wk.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);

/* ============ isometric hero ============ */
function isoScene(kind,done){
  const S_=13, OX=170, OY=100;
  const P=(x,y,z)=>[(x-y)*0.866*S_+OX,(x+y)*0.5*S_-z*S_+OY];
  const pt=(a)=>a.map(v=>v.toFixed(1)).join(',');
  const poly=(pts,fill,extra='')=>`<polygon points="${pts.map(p=>pt(P(...p))).join(' ')}" fill="${fill}" ${extra}/>`;
  const rr=(x0,y0,x1,y1,r,z)=>{const o=[];const cs=[[x1-r,y0+r,-90],[x1-r,y1-r,0],[x0+r,y1-r,90],[x0+r,y0+r,180]];cs.forEach(([cx,cy,a0])=>{for(let i=0;i<=8;i++){const a=(a0+i*90/8)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a),z])}});return o};
  const top=rr(-1,-1,11,11,2.6,0), bot=rr(-1,-1,11,11,2.6,-2.8);
  const all=[...top,...bot].map(p=>P(...p));
  // convex hull
  const hs=all.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lw=[];for(const p of hs){while(lw.length>=2&&cr(lw[lw.length-2],lw[lw.length-1],p)<=0)lw.pop();lw.push(p)}
  const up=[];for(const p of hs.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  const hull=lw.slice(0,-1).concat(up.slice(0,-1));
  const glowC=done?'#7ff0cf':'#a9d0ff';
  let g='';
  const box=(x,y,z,w,d,h,c)=>poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c[0])+poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c[1])+poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c[2]);
  const tree=(x,y,s=1)=>{const [cx,cy]=P(x,y,1.5*s+.9*s);return box(x-.12,y-.12,0,.24,.24,1.4*s,['#3a4a6e','#2e3c5c','#26324f'])+`<ellipse cx="${cx}" cy="${cy}" rx="${8.5*s}" ry="${12*s}" fill="url(#tr)"/>`};
  const lamp=(x,y)=>{const [cx,cy]=P(x,y,.9);return `<circle cx="${cx}" cy="${cy}" r="2.6" fill="#ffe7a8"/><circle cx="${cx}" cy="${cy}" r="7" fill="#ffd16b" opacity=".25"/>`};
  const win=(pts)=>poly(pts,'#ffd879','filter="url(#wg)"');
  const items=[];
  if(kind==='gym'){
    items.push([2,()=>box(1,1,0,4.2,3.6,3,['#5a6cc8','#3e4c99','#33407f'])+win([[5.2,1.8,.6],[5.2,3.8,.6],[5.2,3.8,2.2],[5.2,1.8,2.2]])+win([[1.6,4.6,.6],[3,4.6,.6],[3,4.6,2.2],[1.6,4.6,2.2]])+win([[3.5,4.6,.6],[4.6,4.6,.6],[4.6,4.6,2.2],[3.5,4.6,2.2]])+poly([[1,1,3],[5.2,1,3],[5.2,4.6,3],[1,4.6,3]],'#6b7ddb')]);
    // rack + bar
    items.push([12.6,()=>box(6.4,4.2,0,.32,.32,3.1,['#c9cdf0','#8e94c8','#7a80b8'])]);
    items.push([15.8,()=>box(6.4,7.4,0,.32,.32,3.1,['#c9cdf0','#8e94c8','#7a80b8'])]);
    items.push([14.4,()=>box(6.48,3.3,2.45,.16,5.4,.16,['#eef0ff','#b9bde6','#a3a8da'])+box(6.2,3.55,1.85,.72,.26,1.3,['#3b3f73','#2b2f5c','#24284f'])+box(6.2,7.85,1.85,.72,.26,1.3,['#3b3f73','#2b2f5c','#24284f'])]);
    items.push([15,()=>box(8.6,3.8,0,1.1,3.2,.75,['#7383f5','#5463cf','#4655b8'])]);
    items.push([5.5,()=>tree(9.6,0.6,.95)]);items.push([9.6,()=>tree(1,8.6,1.1)]);items.push([19,()=>tree(9.6,9.4,.9)]);
    items.push([11,()=>lamp(3.2,7.6)]);
  } else if(kind==='run'){
    const st=(rx,ry,cx,cy,z)=>{const o=[];for(let i=0;i<48;i++){const a=i/48*Math.PI*2;o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a),z])}return o};
    items.push([0,()=>poly(st(4.6,3.4,5,5,.02),'#6c79d6')+poly(st(3.6,2.4,5,5,.03),'#2f3560')+poly(st(4.1,2.9,5,5,.035),'none','stroke="#e6e9ff" stroke-width=".8" stroke-dasharray="3 3" opacity=".7"')+poly(st(3.4,2.2,5,5,.04),'#3a5a74')]);
    items.push([10,()=>{const [x,y]=P(8.2,6.6,.6);return `<circle class="float" cx="${x}" cy="${y-10}" r="3" fill="#ffd16b"/><path d="M${x} ${y-7} l0 7 M${x} ${y} l-3 6 M${x} ${y} l4 5 M${x} ${y-5} l-4 2 M${x} ${y-5} l4 -1" stroke="#ffd16b" stroke-width="2" stroke-linecap="round" fill="none"/>`}]);
    items.push([1,()=>tree(0.4,0.6,1)]);items.push([8,()=>tree(9.8,-.2,.85)]);items.push([10,()=>tree(.2,9.8,.9)]);items.push([19.5,()=>tree(9.8,9.7,1)]);
    items.push([12,()=>lamp(5,10)]);items.push([12.5,()=>lamp(10,2.5)]);
  } else {
    const x=3,y=2.6,w=4.2,d=4.2,h=2.4,r=2;
    items.push([10,()=>box(x,y,0,w,d,h,['#4e5fb8','#3e4c99','#34408a'])
      +poly([[x+w,y,h],[x+w,y+d,h],[x+w/2,y+d,h+r],[x+w/2,y,h+r]],'#5d70d0')
      +poly([[x,y+d,h],[x+w,y+d,h],[x+w/2,y+d,h+r]],'#3a4790')
      +win([[x+w,y+.8,.5],[x+w,y+1.9,.5],[x+w,y+1.9,1.6],[x+w,y+.8,1.6]])+win([[x+w,y+2.5,.5],[x+w,y+3.5,.5],[x+w,y+3.5,1.6],[x+w,y+2.5,1.6]])
      +win([[x+1.6,y+d,0],[x+2.6,y+d,0],[x+2.6,y+d,1.7],[x+1.6,y+d,1.7]])+win([[x+1.7,y+d,2.6],[x+2.5,y+d,2.6],[x+2.5,y+d,3.4],[x+1.7,y+d,3.4]])]);
    items.push([1,()=>tree(.6,.6,1.05)]);items.push([6,()=>tree(1,4.8,.9)]);items.push([11,()=>tree(9.6,1.2,1)]);items.push([16,()=>tree(8.8,7.6,.85)]);items.push([18.5,()=>tree(9.8,9.4,.95)]);
    items.push([14,()=>lamp(5.6,9.2)]);
  }
  g=items.sort((a,b)=>a[0]-b[0]).map(i=>i[1]()).join('');
  const topPts=top.map(p=>pt(P(...p))).join(' ');
  const moon = kind==='rest' ? `<circle cx="300" cy="26" r="11" fill="#e9ecff" opacity=".9"/><circle cx="305" cy="22" r="10" fill="#2a2d4c"/>` : '';
  return `<svg class="iso" viewBox="0 0 340 300" role="img" aria-label="Illustration du jour">
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4e8"/><stop offset=".55" stop-color="#e6dcef"/><stop offset="1" stop-color="#b9bde8"/></linearGradient>
    <linearGradient id="topf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4170"/><stop offset="1" stop-color="#262b4f"/></linearGradient>
    <radialGradient id="tr" cx=".4" cy=".35"><stop offset="0" stop-color="#5f86a8"/><stop offset="1" stop-color="#2f4a6c"/></radialGradient>
    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="wg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="halo" cx=".5" cy=".5"><stop offset="0" stop-color="${glowC}" stop-opacity=".35"/><stop offset="1" stop-color="${glowC}" stop-opacity="0"/></radialGradient>
  </defs>
  ${moon}
  <ellipse cx="170" cy="160" rx="168" ry="130" fill="url(#halo)"/>
  <polygon points="${hull.map(pt).join(' ')}" fill="url(#side)"/>
  <polygon points="${topPts}" fill="url(#topf)"/>
  <g opacity=".5">${[2,4.5,7,9.5].map(t=>`<line x1="${P(t,-1,0)[0]}" y1="${P(t,-1,0)[1]}" x2="${P(t,11,0)[0]}" y2="${P(t,11,0)[1]}" stroke="#4a5288" stroke-width=".6"/><line x1="${P(-1,t,0)[0]}" y1="${P(-1,t,0)[1]}" x2="${P(11,t,0)[0]}" y2="${P(11,t,0)[1]}" stroke="#4a5288" stroke-width=".6"/>`).join('')}</g>
  <polygon points="${topPts}" fill="none" stroke="${glowC}" stroke-width="5" filter="url(#gl)" opacity=".9"/>
  <polygon points="${topPts}" fill="none" stroke="#f4f8ff" stroke-width="1.6"/>
  ${g}
  </svg>`;
}

/* ============ render helpers ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function weeklyCount(){const m=mondayOf(todayKey());let c=0;for(let i=0;i<7;i++){const d=S.days[addDays(m,i)];if(d&&d.wk&&d.wk.fin)c++}return c}
function stepStreak(){let k=todayKey(),c=0;const g=S.settings.goal;if(!((S.days[k]||{}).steps>=g))k=addDays(k,-1);while((S.days[k]||{}).steps>=g){c++;k=addDays(k,-1)}return c}
function dayDone(k){const d=S.days[k];if(!d)return false;const t=dayType(k);if(t==='off'){const bw=d.bw?Object.values(d.bw).flat():[];return !!(d.run&&d.run.km>0)||(bw.length>0&&bw.filter(z=>z.done).length>=bw.length/2)}if(t==='rest')return false;return !!(d.wk&&d.wk.fin)}
function dayIcon(k){const t=dayType(k);return t==='off'?I.run:t==='rest'?I.moon:I.dumb}

function topbar(){
  return `<div class="topbar"><div class="brand">FORGE · MASSE PROPRE</div>
  <div class="orb" title="Séances cette semaine">${I.bolt}<span class="badge">${weeklyCount()}/3</span></div></div>`;
}
function weekStrip(){
  const today=todayKey();let h='';
  for(let i=0;i<7;i++){const k=addDays(U.week,i);const d=dateOf(k);
    h+=`<button class="dayb ${k===U.sel?'sel':''} ${k===today?'today':''}" data-act="sel" data-k="${k}" aria-label="${DAYNAMES[d.getDay()]} ${fmtShort(k)}"><span class="c">${dayIcon(k)}${dayDone(k)?'<i class="dot"></i>':''}</span>${DAYSHORT[d.getDay()]} ${d.getDate()}</button>`}
  const end=addDays(U.week,6);

function stepsRow(k){
  const s=(S.days[k]||{}).steps||0, g=S.settings.goal, p=Math.min(1,s/g);
  return `<div class="row"><span class="ic ${p>=1?'mint':''}">${I.steps}</span><div class="grow"><div class="t1">${fmtN(s)} <span class="t2">/ ${fmtN(g)} pas</span></div><div class="bar ${p>=1?'ok':''}" style="margin-top:6px"><i style="width:${p*100}%"></i></div></div>

/* ---------- Séance ---------- */
function viewSeance(){
  const k=U.sel, t=dayType(k), dn=DAYNAMES[dateOf(k).getDay()];
  let heroBig='',heroSub='',title='',kind='gym',done=dayDone(k),body='';
  if(t==='off'){
    const dow=dateOf(k).getDay(), mob=MOB[dow], run=RUN[dow];
    const mobMin=Math.round(mob.items.reduce((a,i)=>a+i[1],0)/60), bm=bwMin(BW[dow]);
    heroBig=`${mobMin+bm+run.min}<sup>min</sup>`;heroSub=`${mobMin} min mobilité + ${bm} min poids du corps + ${run.min} min course`;title=`<b>Poids du corps & course</b><span>${dn}</span>`;kind='run';
    body=offDay(k,mob,run);
  } else if(t==='rest'){
    heroBig=`0<sup>séance</sup>`;heroSub='Repos complet, on garde les pas';title=`<b>Récupération</b><span>${dn}</span>`;kind='rest';
    body=restDay(k);
  } else {
    const wk=getWk(k), tpl=TPL[wk.tpl], m=estMin(wk);
    heroBig=`${m}<sup>min</sup>`;heroSub=`${tpl.focus} · ${wk.ex.length} exercices`;title=`<b>${tpl.name}</b><span>${dn}</span>`;

  ${weekStrip()}<div class="sheet">${body}</div>`;

function workoutDay(k,wk,m){
  const tpl=TPL[wk.tpl], started=setsDone(wk)>0, isLocked=!!(S.days[k]&&S.days[k].wk);
  let h=`<div class="row"><span class="ic">${I.dumb}</span><div class="grow"><div class="t1">${tpl.name} · ${fmtLong(k)}</div><div class="t2">${setsDone(wk)}/${setsTot(wk)} séries · ~${m} min${wk.fin?' · terminée':''}</div></div>
    ${wk.fin?'':`<button class="pill" data-act="regen" data-k="${k}">${I.refresh}Régénérer</button>`}</div>`;
  h+=stepsRow(k);
  if(m>45) h+=`<div class="chips" style="margin:6px 4px"><span class="chip warn">Durée estimée ${m} min : retire une série d’accessoire pour rester sous 45 min</span></div>`;
  tpl.blocks.forEach((bl,bi)=>{
    const exs=wk.ex.map((e,i)=>[e,i]).filter(([e])=>e.b===bi);
    h+=`<div class="block-h"><b>${String.fromCharCode(65+bi)}</b>${bl.label}<span class="sep"></span>repos ${Math.floor(bl.rest/60)}:${pad2(bl.rest%60)}</div>`;
    exs.forEach(([e,ei],j)=>{h+=exCard(k,wk,e,ei,`${String.fromCharCode(65+bi)}${exs.length>1?j+1:''}`)});
  });
  h+= wk.fin
    ? `<button class="cta done" data-act="unfinish" data-k="${k}">${I.check} Séance terminée · ${fmtN(volOf(wk))} kg soulevés</button>`
    : `<button class="cta" data-act="finish" data-k="${k}">${I.check} Terminer la séance</button>`;
  h+=`<p class="note" style="margin:12px 4px 0">Échauffement 5 min inclus dans l’estimation : 2 séries de montée en charge sur le premier exercice. Garde 1–2 reps en réserve sur chaque série.</p>`;
  return h;
}
function exCard(k,wk,e,ei,tag){
  const x=EXI[e.id], sug=suggest(e.id,k), [lo,hi]=x.r;
  const chipCls=sug.kind==='up'?'up':sug.kind==='hold'?'warn':'';

  e.sets.forEach((s,si)=>{

      <div class="stepper"><button data-act="rp" data-ei="${ei}" data-si="${si}" data-d="-1" aria-label="Moins de reps">−</button><input id="rp-${ei}-${si}" type="number" inputmode="numeric" min="0" value="${s.reps}" data-f="reps" data-ei="${ei}" data-si="${si}" aria-label="Reps série ${si+1}"><button data-act="rp" data-ei="${ei}" data-si="${si}" data-d="1" aria-label="Plus de reps">+</button></div>
      <button class="chk ${s.done?'on':''}" data-act="done" data-ei="${ei}" data-si="${si}" aria-label="Valider la série">${I.check}</button></div>`;
  });
  const anyDone=e.sets.some(s=>s.done);
  return `<div class="ex"><div class="ex-h"><span class="ex-tag">${tag}</span><div class="grow"><div class="ex-name">${esc(x.n)}</div><div class="ex-cue">${esc(x.cue)}</div></div></div>
  <div class="chips"><span class="chip">${lo}–${hi} reps</span>${sug.last?`<span class="chip">Dernière : ${sug.last}</span>`:''}<span class="chip ${chipCls}">${sug.msg}</span></div>
  <div class="sets">${sets}</div>
  <div class="ex-actions"><button class="ghost" data-act="addset" data-ei="${ei}">${I.plus}Série</button>${e.sets.length>1?`<button class="ghost" data-act="rmset" data-ei="${ei}">${I.minus}Série</button>`:''}${anyDone||wk.fin?'':`<button class="ghost" data-act="swap" data-ei="${ei}">${I.swap}Changer d’exercice</button>`}</div></div>`;
}
function offDay(k,mob,run){

  <p class="note" style="margin:0 4px 8px">Enchaîne les exercices avec 30 s de transition, puis repos entre les tours. Garde toujours 2–3 reps en réserve : le but est d’ajouter du volume sans entamer la récupération de ta prochaine séance.</p>`;
  B.ex.forEach((id,j)=>{const x=BWX[id],sg=bwSuggest(id,k),[lo,hi]=x.r,u=x.sec?'s':'reps';

    if(j<B.ex.length-1)h+='<div style="height:8px"></div>';});

}

}

/* ============ charts ============ */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function chart(el,data,{type='line',goal=null,unit='',fmt=v=>fmtN(v),minZero=true}={}){
  if(!el)return;
  if(!data.length||data.every(d=>!d.y)){el.innerHTML=`<div class="empty">Pas encore de données ici. Elles apparaîtront dès ta première saisie.</div>`;return}
  const W=340,H=190,L=40,R=12,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const ys=data.map(d=>d.y).filter(v=>v>0);
  let lo=minZero?0:Math.min(...ys), hi=Math.max(...ys,goal||0);
  if(!minZero){const span=Math.max(hi-lo,1);lo=Math.floor(lo-span*.3);hi=hi+span*.3}
  hi=minZero?niceMax(hi*1.08):Math.ceil(hi);
  const y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  const n=data.length, bw=iw/n;
  const x=i=>type==='bar'?L+bw*i+bw/2:L+(n===1?iw/2:i*iw/(n-1));
  let g='';
  const dv=[5,4].find(d=>{const st=(hi-lo)/d;if(st<=0)return false;const pw=Math.pow(10,Math.floor(Math.log10(st)));return [1,2,2.5,5].some(q=>Math.abs(st/pw-q)<1e-9)})||4;
  for(let i=0;i<=dv;i++){const v=lo+(hi-lo)*i/dv;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(45,48,87,.09)"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="#7a7ea8">${v>=10000?Math.round(v/1000)+'k':fmt(v)}</text>`}
  const every=Math.ceil(n/7);
  data.forEach((d,i)=>{if(i%every===0||i===n-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#7a7ea8">${d.x}</text>`});
  if(type==='bar'){
    const w=Math.max(3,Math.min(26,bw-6));
    data.forEach((d,i)=>{if(d.y>0){const top=y(d.y),h=T+ih-top,r=Math.min(4,w/2,h);const ok=goal&&d.y>=goal;g+=`<path d="M${x(i)-w/2} ${T+ih}V${top+r}q0-${r} ${r}-${r}h${w-2*r}q${r} 0 ${r} ${r}V${T+ih}z" fill="${ok?'#3dbb98':'#7383f5'}"/>`}});
  } else {
    const pts=data.map((d,i)=>[x(i),y(d.y)]);
    g+=`<defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7383f5" stop-opacity=".28"/><stop offset="1" stop-color="#7383f5" stop-opacity="0"/></linearGradient></defs>`;
    if(pts.length>1)g+=`<path d="M${pts[0][0]} ${T+ih}L${pts.map(p=>p.join(' ')).join('L')}L${pts[pts.length-1][0]} ${T+ih}z" fill="url(#af)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#4f5fd6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp=pts[pts.length-1];g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="#4f5fd6" stroke="#fff" stroke-width="2"/><text x="${Math.min(lp[0],W-R-4)}" y="${lp[1]-10}" text-anchor="end" font-size="11" font-weight="800" fill="#2d3057">${fmt(data[n-1].y)}${unit}</text>`;
  }
  if(goal)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#2f9c80" stroke-dasharray="4 4" stroke-width="1.4"/>`;
  g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="#2d3057" stroke-opacity=".25" visibility="hidden"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique">${g}<rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let i=type==='bar'?Math.floor((px-L)/bw):Math.round((px-L)/(n===1?1:iw/(n-1)));i=Math.max(0,Math.min(n-1,i));const d=data[i];
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');tip.hidden=false;tip.textContent=`${d.lab||d.x} · ${d.y?fmt(d.y)+unit:'—'}`;tip.style.left=(x(i)/W*100)+'%';tip.style.top=(y(d.y||lo)/H*r.height)+'px'};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('visibility','hidden')});

function fridgeSet(){return new Set(S.settings.fridge||DEFAULT_FRIDGE)}
function qtyOf(id,g){
  const f=FOOD[id];
  if(f.u&&f.u.g){const st=f.u.h?.5:1;const n=Math.max(st,Math.round(g/f.u.g/st)*st);return {g:n*f.u.g,lab:`${String(n).replace('.',',')} ${n>1?f.u.p:f.u.s}`}}
  const r=g>=100?10:5;const gg=Math.max(5,Math.round(g/r)*r);
  return {g:gg,lab:f.u&&f.u.ml?`${gg} ml`:`${gg} g`};
}
function buildMeal(rec,target,rnd,fr){
  const items=rec.ing.map(([alt,g,fx])=>{const o=alt.split('|');const have=o.filter(x=>fr.has(x));return {id:have.length?have[Math.floor(rnd()*have.length)]:o[0],miss:!have.length,g,fx:!!fx}});
  const kc=it=>FOOD[it.id].k*it.g/100;
  const fixedK=items.filter(i=>i.fx).reduce((a,i)=>a+kc(i),0), varK=items.filter(i=>!i.fx).reduce((a,i)=>a+kc(i),0);
  const sc=Math.max(.5,Math.min(2.2,(target-fixedK)/Math.max(1,varK)));
  const out={rec,items:[],k:0,p:0,c:0,f:0};
  items.forEach(it=>{const q=qtyOf(it.id,it.fx?it.g:it.g*sc);const f=FOOD[it.id];out.items.push({...it,g:q.g,lab:q.lab});out.k+=f.k*q.g/100;out.p+=f.p*q.g/100;out.c+=f.c*q.g/100;out.f+=f.f*q.g/100});
  return out;
}
const missCount=(rec,fr)=>rec.ing.filter(([alt])=>!alt.split('|').some(x=>fr.has(x))).length;
function planDay(k){
  const fr=fridgeSet(), N=nutri(k), regen=((S.days[k]||{}).meals||{}).r||{};
  const out=[];const used=[];
  MEALSLOTS.forEach((sl,i)=>{
    let cands=RECIPES.filter(r=>r.t===sl.t);
    const best=Math.min(...cands.map(r=>missCount(r,fr)));
    let pool=cands.filter(r=>missCount(r,fr)===best);
    const sh=rng(hash(k+'|pool|'+i));pool=pool.map(r=>[sh(),r]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    const ri=regen[i]||0;let idx=ri%pool.length;
    if(pool.length>1&&used.includes(pool[idx].id))idx=(idx+1)%pool.length;
    const rec=pool[idx];used.push(rec.id);
    out.push({slot:sl,i,poolSize:pool.length,...buildMeal(rec,N.target*sl.pct,rng(hash(k+'|alt|'+i+'|'+ri)),fr)});
  });
  return out;
}

      const items=FOODS.filter(f=>f[2]===cat&&(!q||f[1].toLowerCase().includes(q)));if(!items.length)return;
      const all=items.every(f=>fr.has(f[0]));
      body+=`<div class="sec-h"><h3>${label}</h3><button class="ghost" data-act="fcat" data-c="${cat}" data-on="${all?0:1}">${all?'Tout retirer':'Tout cocher'}</button></div><div class="chips" style="gap:8px">${items.map(f=>`<button class="pill ${fr.has(f[0])?'dark':''}" data-act="fr" data-id="${f[0]}" aria-pressed="${fr.has(f[0])}">${fr.has(f[0])?I.check:''}${f[1]}</button>`).join('')}</div>`;
    });
  } else {
    const fr=fridgeSet(), agg={};
    for(let i=0;i<7;i++){const kk=addDays(todayKey(),i);planDay(kk).forEach(m=>m.items.forEach(it=>{agg[it.id]=(agg[it.id]||0)+it.g}))}
    const toBuy=Object.keys(agg).filter(id=>!fr.has(id));
    body+=`<p class="note" style="margin:10px 4px 0">Total des ingrédients des menus des 7 prochains jours. Vérifie que tes stocks suivent, surtout pour les protéines.</p>`;
    if(toBuy.length) body+=`<div class="chips" style="margin:8px 4px"><span class="chip warn">À acheter : ${toBuy.map(id=>FOOD[id].n).join(', ')}</span></div>`;
    FCATS.forEach(([cat,label])=>{const ids=Object.keys(agg).filter(id=>FOOD[id].cat===cat);if(!ids.length)return;
      body+=`<div class="sec-h"><h3>${label}</h3></div><div class="card" style="padding:4px 14px">${ids.map(id=>{const f=FOOD[id],g=agg[id];const lab=f.u&&f.u.g?`${Math.ceil(g/f.u.g)} ${Math.ceil(g/f.u.g)>1?f.u.p:f.u.s}`:g>=1000?`${(g/1000).toFixed(1).replace('.',',')} ${f.u&&f.u.ml?'L':'kg'}`:`${g} ${f.u&&f.u.ml?'ml':'g'}`;return `<div class="hist"><b${fr.has(id)?'':' style="color:#9a5615"'}>${f.n}</b><span>${lab}</span></div>`}).join('')}</div>`});
  }
  return `${mealsHead(k,N,ms)}<div class="sheet">${segs}${body}</div>`;
}

/* ============ render ============ */
function render(){
  const v=document.getElementById('view');
  const y=window.scrollY;
  v.innerHTML = U.tab==='repas'?viewRepas():U.tab==='pas'?viewPas():U.tab==='progres'?viewProgres():U.tab==='plan'?viewPlan():viewSeance();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===U.tab));
  drawCharts();
  window.scrollTo(0,y);
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function confirmBox(title,text,okLabel,onOk){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h4>${title}</h4><p class="note">${text}</p><div class="acts"><button class="pill" id="m-no">Annuler</button><button class="pill dark" id="m-ok">${okLabel}</button></div></div>`;
  m.hidden=false;document.getElementById('m-no').onclick=()=>m.hidden=true;document.getElementById('m-ok').onclick=()=>{m.hidden=true;onOk()};
}

/* ============ rest timer ============ */
const T={end:0,total:0,h:null,label:''};
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.15,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.15);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.16)})}catch(e){}if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec,label){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  T.end=Date.now()+sec*1000;T.total=sec;T.label=label;T.fired=false;clearInterval(T.h);T.h=setInterval(tick,250);tick();
}
function tick(){
  const el=document.getElementById('timer');const left=Math.round((T.end-Date.now())/1000);
  if(left<=0&&!T.fired){T.fired=true;beep()}
  const over=left<=0;const a=Math.abs(left);
  el.hidden=false;el.classList.toggle('over',over);
  el.innerHTML=`<div><small>${over?'Go, série suivante':T.label}</small><br><b>${over?'+':''}${Math.floor(a/60)}:${pad2(a%60)}</b></div><button class="pill" data-act="t+">+30 s</button><button class="pill dark" data-act="tstop" aria-label="Fermer le minuteur">${I.x}</button>`;
  if(left<-90)stopTimer();
}
function stopTimer(){clearInterval(T.h);document.getElementById('timer').hidden=true}

/* ============ events ============ */
function curWk(){return lockWk(U.sel)}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-tab]');if(!b)return;
  if(b.dataset.tab){U.tab=b.dataset.tab;try{localStorage.setItem(LSK+'-tab',U.tab)}catch(e){}render();window.scrollTo(0,0);return}
  const a=b.dataset.act,ei=+b.dataset.ei,si=+b.dataset.si;
  switch(a){
    case 'sel':U.sel=b.dataset.k;U.week=mondayOf(U.sel);U.tab='seance';render();break;
    case 'goto':U.sel=b.dataset.k;U.week=mondayOf(U.sel);U.tab='seance';render();window.scrollTo(0,0);break;
    case 'wk':U.week=addDays(U.week,+b.dataset.d);U.sel=addDays(U.sel,+b.dataset.d);render();break;
    case 'regen':{const k=b.dataset.k;const go=()=>{const d=S.days[k]||(S.days[k]={});d.regen=(d.regen||0)+1;delete d.wk;saveDay(k);render();toast('Nouvelle séance générée')};
      const wk=getWk(k);if(setsDone(wk)>0)confirmBox('Régénérer la séance ?','Tu as déjà validé des séries aujourd’hui. Elles seront perdues.','Régénérer',go);else go();break}
    case 'swap':{const wk=curWk();const e=wk.ex[ei];const tpl=TPL[wk.tpl];const slot=tpl.blocks[e.b].slots[wk.ex.filter(x=>x.b===e.b).indexOf(e)];
      const used=new Set(wk.ex.map(x=>x.id));const pool=poolFor(slot).filter(x=>!used.has(x.id));if(!pool.length){toast('Pas d’autre exercice disponible pour ce mouvement');break}
      const p=pool[Math.floor(Math.random()*pool.length)];wk.ex[ei]=makeEx(p.id,e.b,U.sel,e.sets.length);saveDay(U.sel);render();break}
    case 'kg':{const wk=curWk();const e=wk.ex[ei],x=EXI[e.id];const s=e.sets[si];s.kg=Math.max(0,+(((+s.kg||0)+(+b.dataset.d)*x.inc)).toFixed(2));saveDay(U.sel);render();break}
    case 'rp':{const wk=curWk();const s=wk.ex[ei].sets[si];s.reps=Math.max(0,(+s.reps||0)+(+b.dataset.d));saveDay(U.sel);render();break}
    case 'done':{const wk=curWk();const e=wk.ex[ei];const s=e.sets[si];s.done=!s.done;saveDay(U.sel);
      if(s.done){const bl=TPL[wk.tpl].blocks[e.b];const grp=wk.ex.filter(x=>x.b===e.b);const isFirstOfPair=grp.length>1&&grp.indexOf(e)===0;
        startTimer(isFirstOfPair?Math.round(bl.rest/2):bl.rest,isFirstOfPair?'Enchaîne le 2e exercice':`Repos · ${EXI[e.id].n}`)}
      render();break}
    case 'addset':{const wk=curWk();const e=wk.ex[ei];const l=e.sets[e.sets.length-1];e.sets.push({kg:l.kg,reps:l.reps,done:false});saveDay(U.sel);render();break}
    case 'rmset':{const wk=curWk();const e=wk.ex[ei];if(e.sets.length>1)e.sets.pop();saveDay(U.sel);render();break}
    case 'finish':{const k=b.dataset.k;const wk=curWk();if(!setsDone(wk)){toast('Valide au moins une série avant de terminer');break}
      // records
      const recs=[];wk.ex.forEach(e=>{const best=Math.max(0,...e.sets.filter(s=>s.done).map(s=>e1rm(+s.kg,+s.reps)));if(!best)return;const prev=Math.max(0,...history(e.id,k).flatMap(h=>h.done.map(s=>e1rm(+s.kg,+s.reps))));if(prev>0&&best>prev)recs.push(EXI[e.id].n)});
      wk.fin=true;saveDay(k);stopTimer();render();toast(recs.length?`Séance validée. Record battu : ${recs.join(', ')}`:`Séance validée · ${fmtN(volOf(wk))} kg soulevés`);break}
    case 'unfinish':{const wk=curWk();wk.fin=false;saveDay(U.sel);render();break}
    case 'steps+':{const k=b.dataset.k;const d=S.days[k]||(S.days[k]={});const before=d.steps||0;d.steps=Math.max(0,before+(+b.dataset.n));saveDay(k);if(before<S.settings.goal&&d.steps>=S.settings.goal)toast(`${fmtN(S.settings.goal)} pas atteints. Bien joué.`);render();break}
    case 'mobt':{ev.stopPropagation();startTimer(+b.dataset.s,b.dataset.n);break}
    case 'mob':{if(ev.target.closest('[data-act="mobt"]'))break;const k=b.dataset.k;const d=S.days[k]||(S.days[k]={});d.mob=d.mob||{};const i=b.dataset.i;if(d.mob[i])delete d.mob[i];else d.mob[i]=1;saveDay(k);render();break}
    case 'prog':U.prog=b.dataset.v;render();break;
    case 'bwr':{const k=b.dataset.k,id=b.dataset.id;const z=lockBw(k)[id][+b.dataset.si];z.r=Math.max(0,(+z.r||0)+(+b.dataset.d)*(BWX[id].sec?5:1));saveDay(k);render();break}
    case 'bwd':{const k=b.dataset.k,id=b.dataset.id,si=+b.dataset.si;const bw=lockBw(k);const z=bw[id][si];z.done=!z.done;saveDay(k);
      if(z.done){const B=BW[dateOf(k).getDay()];const last=B.ex.indexOf(id)===B.ex.length-1;startTimer(last?B.rest:30,last?`Repos · fin du tour ${si+1}`:`Enchaîne : ${BWX[B.ex[B.ex.indexOf(id)+1]].n}`)}
      render();break}
    case 'msub':U.msub=b.dataset.v;render();break;
    case 'mday':U.mealDay=addDays(U.mealDay||todayKey(),+b.dataset.d);render();break;
    case 'mregen':{const k=b.dataset.k,i=b.dataset.i;if(+b.dataset.n<2){toast('C’est le seul repas possible avec ton frigo actuel. Ajoute des aliments pour plus de choix.');break}const d=S.days[k]||(S.days[k]={});d.meals=d.meals||{};d.meals.r=d.meals.r||{};d.meals.r[i]=(d.meals.r[i]||0)+1;if(d.meals.e)delete d.meals.e[i];saveDay(k);render();break}
    case 'eat':{const k=b.dataset.k,i=b.dataset.i;const d=S.days[k]||(S.days[k]={});d.meals=d.meals||{};d.meals.e=d.meals.e||{};if(d.meals.e[i])delete d.meals.e[i];else d.meals.e[i]=1;saveDay(k);render();break}
    case 'fr':{const f=fridgeSet();const id=b.dataset.id;if(f.has(id))f.delete(id);else f.add(id);S.settings.fridge=[...f];saveSettings();render();break}
    case 'fcat':{const f=fridgeSet();FOODS.filter(x=>x[2]===b.dataset.c).forEach(x=>{if(b.dataset.on==='1')f.add(x[0]);else f.delete(x[0])});S.settings.fridge=[...f];saveSettings();render();break}
    case 't+':T.end+=30000;T.fired=false;tick();break;
    case 'tstop':stopTimer();break;
    case 'backup':{const txt=JSON.stringify({app:'forge',v:1,at:new Date().toISOString(),settings:S.settings,days:S.days});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=`forge-sauvegarde-${todayKey()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);try{localStorage.setItem(LSK+'-lastbackup',todayKey())}catch(e){}toast('Sauvegarde téléchargée');break}
    case 'export':{const txt=JSON.stringify({settings:S.settings,days:S.days});const show=()=>{document.getElementById('dump').innerHTML=`<textarea class="dump" id="dump-ta" readonly>${esc(txt)}</textarea>`;const ta=document.getElementById('dump-ta');ta.focus();ta.select()};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Données copiées'),show)}else show();break}
    case 'reset':confirmBox('Tout effacer ?','Séances, pas, pesées et réglages seront supprimés définitivement.','Effacer',async()=>{const keys=Object.keys(S.days);S.days={};S.settings={...DEFAULTS};lsSave();if(S.col){for(const k of keys){try{await S.col.doc('d_'+k).delete()}catch(e){}}try{await S.col.doc('settings').set({...DEFAULTS})}catch(e){}}render();toast('Données effacées')});break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target;const f=el.dataset&&el.dataset.f;if(!f)return;
  const v=el.value;
  if(f==='kg'||f==='reps'){const wk=curWk();const s=wk.ex[+el.dataset.ei].sets[+el.dataset.si];s[f]=Math.max(0,parseFloat(String(v).replace(',','.'))||0);saveDay(U.sel);render();return}
  if(f==='bwr'){const k=el.dataset.k;lockBw(k)[el.dataset.id][+el.dataset.si].r=Math.max(0,parseInt(v)||0);saveDay(k);render();return}
  if(f==='steps'){const k=el.dataset.k;const d=S.days[k]||(S.days[k]={});d.steps=Math.max(0,parseInt(v)||0);saveDay(k);render();return}
  if(f.startsWith('run')){const k=el.dataset.k;const d=S.days[k]||(S.days[k]={});d.run=d.run||{};d.run[f.slice(3)]=parseFloat(String(v).replace(',','.'))||0;saveDay(k);render();return}
  if(f==='wday'){const k=el.dataset.k;const d=S.days[k]||(S.days[k]={});const n=parseFloat(String(v).replace(',','.'));if(n>0){d.w=n;S.settings.w=n;saveSettings()}else delete d.w;saveDay(k);render();return}
  if(f==='set'){const key=el.dataset.key;S.settings[key]=(key==='sex'||key==='eq')?v:(parseFloat(v)||DEFAULTS[key]);saveSettings();render();return}
  if(f==='progex'){U.progEx=v;render();return}
});

document.addEventListener('input',ev=>{if(ev.target.id==='fq'){U.fq=ev.target.value;const pos=ev.target.selectionStart;render();const el=document.getElementById('fq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}});
document.addEventListener('change',ev=>{if(ev.target.id!=='restore-f'||!ev.target.files[0])return;const f=ev.target.files[0];f.text().then(t=>{const r=JSON.parse(t);if(!r||!r.days||!r.settings)throw 0;confirmBox('Restaurer cette sauvegarde ?',`Sauvegarde du ${r.at?new Date(r.at).toLocaleDateString('fr-FR'):'?'} · ${Object.keys(r.days).length} jours. Elle remplace les données actuelles du téléphone.`,'Restaurer',()=>{S.days=r.days;S.settings={...DEFAULTS,...r.settings};lsSave();render();toast('Données restaurées')})}).catch(()=>toast('Ce fichier n’est pas une sauvegarde Forge valide'));ev.target.value=''});
/* ============ boot ============ */
lsLoad();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
connectDb();
// recheck the date when the app comes back to the foreground
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=todayKey();if(U._today&&U._today!==t){U.sel=t;U.week=mondayOf(t)}U._today=t;render()}});
U._today=todayKey();
</script>
